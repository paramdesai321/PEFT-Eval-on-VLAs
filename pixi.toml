[workspace]
channels = ["conda-forge"]
name = "deep-learning-projects"
platforms = [
  "osx-arm64",
  { name = "linux-64-nvidia", platform = "linux-64", cuda = "12.4" },
]
version = "0.1.0"
[feature.macos.activation.env]
KMP_DUPLICATE_LIB_OK = "TRUE"

[dependencies]
python = "3.12.*"
ipykernel = ">=6,<8"
jupyterlab = ">=4,<5"
numpy = ">=1.26,<2.3"
pandas = ">=2,<3"
matplotlib = ">=3.8,<4"
ipywidgets = ">=8.1,<9"
pixi-kernel = ">=0.7,<0.8"
pip = ">=26.2.2,<27"
datetime = ">=6.0,<7"

[constraints]
fsspec = "<=2026.7.0"

# [pypi-dependencies]
# peft = ">=0.21.2,<0.22"
# lerobot = { git = "https://github.com/huggingface/lerobot.git", branch = "main", extras = [
#   "smolvla",
#   "dataset",
# ] }


# --- CUDA Feature ---
[feature.cuda]
platforms = ["linux-64-nvidia"]

[feature.macos]
platforms = ["osx-arm64"]

[tasks]
jupyterlab = "jupyter lab"
test-smolvla = "python3 -m smoke_test_smolVLA.test_smolvla"
test-tensor-batching = "python3 -m smoke_test_smolVLA.tensor_batching_smolVLA"
test-mock-action-smolvla = "python3 -m smoke_test_smolVLA.mock_action_smolVLA"

[environments]
default = ["macos"]

[environments.cuda]
features = ["cuda"]

[feature.cuda.pypi-dependencies]
peft = ">=0.21.2, <0.22"
torch = ">=2.15.0, <3"
lerobot = { git = "https://github.com/huggingface/lerobot.git", branch = "main", extras = [
  "smolvla",
  "dataset",
] }


[feature.macos.pypi-dependencies]
peft = ">=0.21.2, <0.22"
torch = ">=2.10.0, <3"
lerobot = { git = "https://github.com/huggingface/lerobot.git", branch = "main", extras = [
  "smolvla",
  "dataset",
] }
