[workspace]
channels = ["conda-forge"]
name = "deep-learning-projects"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = "3.11.*"
ipykernel = ">=6,<8"
jupyterlab = ">=4,<5"
numpy = ">=1.26,<3"
pandas = ">=2,<4"
matplotlib = ">=3.8,<4"
ipywidgets = ">=8.1,<9"
pixi-kernel = ">=0.7,<0.8"
pip = ">=26.2.2,<27"
pytorch = ">=2.14.1,<3"
torchvision = ">=0.29.1,<0.30"
datetime = ">=6.0,<7"

[feature.cpu.target.linux-64.dependencies]
pytorch = ">=2.5,<3"

[feature.cuda.target.linux-64.pypi-dependencies]
torch = ">=2.5"

[feature.macos.target.osx-arm64.dependencies]
pytorch = ">=2.5,<3"

[tasks]
lab = "jupyter lab"

[environments]
default = ["cpu"]
cuda = ["cuda"]
macos = ["macos"]